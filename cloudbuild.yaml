availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/firebase-api-key/versions/latest
      env: 'FIREBASE_API_KEY'

steps:
  # Step 1: Build the optimized production Docker image using Cloud Build.
  # Firebase config is baked into the frontend bundle at build time (vite.config.ts), so it
  # has to be passed as --build-arg here — the project/database IDs come from substitution
  # variables (not secret, same values ship in every Firebase web app's JS bundle anyway),
  # the API key comes from Secret Manager. See GCP_DEPLOYMENT.md for one-time setup.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg FIREBASE_PROJECT_ID="$_FIREBASE_PROJECT_ID" \
          --build-arg FIRESTORE_DATABASE_ID="$_FIRESTORE_DATABASE_ID" \
          --build-arg FIREBASE_API_KEY="$$FIREBASE_API_KEY" \
          --build-arg FIREBASE_APP_ID="$_FIREBASE_APP_ID" \
          --build-arg FIREBASE_AUTH_DOMAIN="$_FIREBASE_AUTH_DOMAIN" \
          --build-arg FIREBASE_STORAGE_BUCKET="$_FIREBASE_STORAGE_BUCKET" \
          --build-arg FIREBASE_MESSAGING_SENDER_ID="$_FIREBASE_MESSAGING_SENDER_ID" \
          -t "gcr.io/$PROJECT_ID/suvenedu-service:latest" \
          -t "gcr.io/$PROJECT_ID/suvenedu-service:$COMMIT_SHA" \
          .
    secretEnv: ['FIREBASE_API_KEY']

  # Step 2: Push the image to Google Container Registry (GCR)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/suvenedu-service:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/suvenedu-service:latest']

  # Step 3: Deploy to Google Cloud Run with custom autoscaling rules for high-concurrency (10k users)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'suvenedu-service',
      '--image', 'gcr.io/$PROJECT_ID/suvenedu-service:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '3000',
      '--min-instances', '5',         # Keep warm container instances active to avoid 9:00 AM cold starts
      '--max-instances', '50',         # Scale to up to 50 active container environments automatically
      '--cpu', '2',                    # Dedicate 2 vCPUs per container instance
      '--memory', '2Gi',               # Dedicate 2GB memory per container instance
      '--concurrency', '100',          # Allow up to 100 parallel connections per container instance
      '--timeout', '60s'
    ]

images:
  - 'gcr.io/$PROJECT_ID/suvenedu-service:latest'
  - 'gcr.io/$PROJECT_ID/suvenedu-service:$COMMIT_SHA'

# Non-secret Firebase web config (same values that ship in any Firebase web app's JS bundle
# regardless — see GCP_DEPLOYMENT.md). Override at trigger time with
# `--substitutions=_FIREBASE_PROJECT_ID=...` if these ever change.
substitutions:
  _FIREBASE_PROJECT_ID: 'project-02bb6275-51ac-45e7-940'
  _FIRESTORE_DATABASE_ID: 'suven-edu'
  _FIREBASE_APP_ID: '1:486328864423:web:6a971b689b5a81e51c5582'
  _FIREBASE_AUTH_DOMAIN: 'project-02bb6275-51ac-45e7-940.firebaseapp.com'
  _FIREBASE_STORAGE_BUCKET: 'project-02bb6275-51ac-45e7-940.firebasestorage.app'
  _FIREBASE_MESSAGING_SENDER_ID: '486328864423'
